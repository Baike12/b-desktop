<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    b-desktop 默认应用图标：蓝底圆角方形 + 白色「思考火花」。
    纯几何图形，不绑定任何吉祥物角色，作为原生默认外观。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f8ceb" />
      <stop offset="1" stop-color="#0b5fc0" />
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#bg)" />
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#sheen)" />
  <!-- 主火花：四角星，中心在画布中轴偏左，顶部圆滑 -->
  <path
    d="M232 96
       c 14 78 44 108 122 122
       c -78 14 -108 44 -122 122
       c -14 -78 -44 -108 -122 -122
       c 78 -14 108 -44 122 -122 z"
    fill="#ffffff" />
  <!-- 次火花：右下角的小四角星，与主星呼应 -->
  <path
    d="M356 300
       c 8 44 24 60 68 68
       c -44 8 -60 24 -68 68
       c -8 -44 -24 -60 -68 -68
       c 44 -8 60 -24 68 -68 z"
    fill="#ffffff" fill-opacity="0.82" />
</svg>
